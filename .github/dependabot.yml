version: 2
updates:
  # npm dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Collapse all minor/patch bumps into a single PR to reduce noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # stylelint and its shared configs have peer ranges. Bump them in one PR,
      # or npm ci fails with ERESOLVE. No update-types, so majors group too.
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"

  # GitHub Actions used by workflows (keeps action versions current once CI lands).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
